<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kubic Load Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1a2e;--panel:#222240;--panel2:#2a2a4d;--line:#333360;--txt:#e8e8f2;--mut:#9a9ac0;--acc:#e8751a;--ok:#34c38f;--bad:#ef5350;--warn:#f1b44c}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 12px}
p{margin:0 0 10px}a{color:var(--acc)}
.mut{color:var(--mut)}.small{font-size:12px}.right{text-align:right}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
input::placeholder,textarea::placeholder{color:#6c6c92}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.sm{padding:4px 10px;font-size:12px}.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.wide{width:100%;padding:11px 14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--mut);cursor:pointer;font-size:13px}.link:hover{color:var(--acc)}.link.danger:hover{color:var(--bad)}
.wordmark{font-weight:700;letter-spacing:.08em;font-size:15px}.wordmark i{display:inline-block;width:11px;height:11px;background:var(--acc);margin:0 6px;vertical-align:-1px}
/* auth */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.authbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px;width:100%;max-width:400px}
.authbox .f{margin-bottom:14px}.err{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0}
/* shell */
#app{display:none;min-height:100%}
.side{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side .wordmark{padding:20px 18px}
.nav a{display:block;padding:10px 18px;color:var(--mut);text-decoration:none;border-left:3px solid transparent;cursor:pointer}
.nav a:hover{color:var(--txt)}.nav a.on{color:var(--txt);border-left-color:var(--acc);background:rgba(232,117,26,.08)}
.side .who{margin-top:auto;padding:16px 18px;border-top:1px solid var(--line);font-size:12px}
.main{margin-left:220px;padding:24px 28px 60px;max-width:1280px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}.top .sp{flex:1}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:rgba(154,154,192,.15);color:var(--mut)}
.pill.ok{background:rgba(52,195,143,.15);color:var(--ok)}.pill.warn{background:rgba(241,180,76,.15);color:var(--warn)}.pill.bad{background:rgba(239,83,80,.15);color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.card h2 .n{color:var(--acc);margin-right:6px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.span2{grid-column:span 2}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row .sp{flex:1}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:20px;align-items:start}
.sticky{position:sticky;top:20px}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid rgba(51,51,96,.5);vertical-align:top}
table.t ul{margin:0;padding-left:16px}
.scroll{overflow-x:auto}
.rate{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px}
.banner{background:rgba(241,180,76,.12);border:1px solid rgba(241,180,76,.4);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.checks{background:rgba(241,180,76,.1);border:1px solid rgba(241,180,76,.35);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:12px}
.checks b{color:var(--warn)}.checks ul{margin:6px 0 0;padding-left:16px}
.errbox{background:rgba(239,83,80,.1);border:1px solid rgba(239,83,80,.4);color:#ff9d9b;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.chips button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--mut);cursor:pointer}
.chips button:hover{border-color:var(--acc);color:var(--txt)}.chips button.on{background:rgba(52,195,143,.12);border-color:rgba(52,195,143,.4);color:var(--ok);cursor:default}
.timing{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel)}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
.note{font-size:12px;color:var(--mut);margin-top:4px}.note.warn{color:var(--warn)}
#toast{position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--acc);border-radius:8px;padding:10px 16px;display:none;z-index:99;max-width:420px}
@media (max-width:1000px){.cols{grid-template-columns:1fr}.sticky{position:static}}
@media (max-width:900px){.side{position:static;width:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.nav{display:flex;flex-wrap:wrap}.side .who{margin:0;border:0}.main{margin:0;padding:16px}.g2,.g3,.g4{grid-template-columns:1fr}.span2{grid-column:auto}}
</style>
</head>

<div id="auth"><div class="authbox" id="authbox"><div class="wordmark">KUBIC<i></i>LOAD SHEETS</div><p class="mut" style="margin-top:14px">Loading…</p></div></div>
<div id="app">
  <aside class="side">
    <div class="wordmark">KUBIC<i></i>LOAD SHEETS</div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="toast"></div>

async function buildGuidePdf(files, pageSpec) {

}
function fromJob(job) {
  const stop = s => ({siteId:"", company:s.company || "", title:s.title || "", suburb:s.suburb || "", address:s.address || "", contact:s.contact || "", date:s.date || "", time:s.time || ""});
  return {pickups:(job.pickups || []).map(stop), deliveries:(job.deliveries || []).map(stop), vehicle:job.vehicle || "", carrier:job.carrier || "", rate:job.rate || "",
    quantity:job.quantity || "", reference:job.reference || "", instructions:(job.instructions || []).join("\n"), highlight:!!job.highlight, compliance:false, schedule:false, noGuides:false, extraGuides:(job.guides || []).slice()};
}
/** Things worth a second look before the sheet goes to a carrier. None of them stop the download. */
function checkList(f) {
  const out = []; const firstPick = f.pickups.map(p => p.date).filter(Boolean).sort()[0];
  f.pickups.forEach((p, i) => { const n = f.pickups.length > 1 ? " " + (i + 1) : "";
    if (!p.date) out.push(`Pick up${n} has no date.`); if (!p.time.trim()) out.push(`Pick up${n} has no time.`); if (!p.address.trim()) out.push(`Pick up${n} has no street address.`); });
  f.deliveries.forEach((d, i) => { const n = f.deliveries.length > 1 ? " " + (i + 1) : "";
    if (!d.date) out.push(`Delivery${n} has no date.`);
    else if (firstPick && d.date < firstPick) out.push(`Delivery${n} is dated before the pick up.`);
    else if (firstPick && d.date === firstPick) out.push(`Delivery${n} is on the same day as the pick up — check that is right.`);
    if (!d.time.trim()) out.push(`Delivery${n} has no time.`); if (!d.address.trim()) out.push(`Delivery${n} has no street address.`); });
  if (!f.carrier.trim()) out.push("No carrier entered."); if (!f.rate.trim()) out.push("No rate entered.");
  if (!f.compliance) out.push("Carrier compliance not confirmed. Check the carrier's insurance and questionnaire are current in the Compliance Portal before booking (QMS-023).");
  if (!f.schedule) out.push("Schedule not confirmed. Check the job can be done within legal work and rest hours, including loading and waiting time (QMS-023).");
  f.pickups.concat(f.deliveries).forEach(s => { const site = D.sites.find(x => x.id === s.siteId); if (site && /not confirmed/i.test(site.notes || "")) out.push(`${site.company}: ${site.notes}`); });
  return out;
}
/** One row per carrier: loads, first and last pick up date, and loads where the booking checks were not confirmed. */
function carriersCsv() {
  const m = new Map();

    const r = m.get(j.carrier.toLowerCase()) || {name:j.carrier, loads:0, first:d, last:d, unchecked:0}; r.loads++; if (d && (!r.first || d < r.first)) r.first = d; if (d && (!r.last || d > r.last)) r.last = d;
    if (j.checks && !(j.checks.compliance && j.checks.schedule)) r.unchecked++; m.set(j.carrier.toLowerCase(), r); });
  if (!m.size) return "";
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  return ["carrier,loads,first_pick_up,last_pick_up,loads_checks_not_confirmed"].concat(Array.from(m.values()).sort((a, b) => a.name.localeCompare(b.name)).map(r => [r.name, r.loads, r.first, r.last, r.unchecked].map(q).join(","))).join("\r\n");
}

async function generate(podOnly) {

        <span class="err" id="gu-err" style="margin:0">${esc(guideErr)}</span></div></div>
      <div class="row" style="margin-top:14px"><button class="btn pri" id="se-save">Save site</button><button class="btn" id="se-cancel">Cancel</button><span class="err" id="se-err" style="margin:0"></span></div></div>` : ""}
    <div class="card"><div class="row" style="margin-bottom:12px"><input id="sq" aria-label="Search the address book" placeholder="Search by company, suburb, address or contact…" value="${esc(siteQ)}" style="flex:1;min-width:220px"><button class="btn pri" id="se-add">+ Add site</button><button class="btn" id="se-import">Import</button><button class="btn" id="se-export" ${D.sites.length ? "" : "disabled"}>Export</button><input type="file" id="se-file" accept=".json,application/json" hidden></div>
    <div class="scroll"><table class="t"><thead><tr><th>Site</th><th>Address</th><th>Contact</th><th>Standing instructions</th><th></th></tr></thead><tbody id="srows">${siteRows()}</tbody></table></div>
    <p class="mut small" style="margin:12px 0 0">Import adds the sites from an address book file (the kind Export makes) and skips any that are already here. The address book is stored encrypted and is only readable after signing in.</p></div>
    <div class="card"><h2>Load restraint guides</h2>
    ${guides().length ? `<div class="scroll"><table class="t"><thead><tr><th>Guide</th><th>Pages</th><th>Used by</th><th>Added</th><th></th></tr></thead><tbody id="grows">${guides().map(g => { const used = D.sites.filter(x => (x.guides || []).includes(g.id));
      return `<tr data-gid="${esc(g.id)}"><td><b>${esc(g.name)}</b></td><td>${g.pages}</td><td class="small">${used.length ? esc(used.map(x => x.company + (x.suburb ? " — " + x.suburb : "")).join("; ")) : `<span class="mut">No sites yet</span>`}</td><td class="mut small" style="white-space:nowrap">${stamp(g.at)}<br>${esc(g.by)}</td>
        <td class="right" style="white-space:nowrap"><button class="btn sm" data-gact="view">Download</button> <button class="btn sm danger" data-gact="del">Remove</button></td></tr>`; }).join("")}</tbody></table></div>` : `<p class="mut" style="margin:0">None yet. Edit a site and upload its guide there; the same guide can then be ticked on any other site.</p>`}
    <p class="mut small" style="margin:12px 0 0">A guide attached to a site is added to every load order for that site, after the terms and before the POD pages. It can be left off a single sheet on the New load sheet screen.</p></div>`;
}
function bSites() {
  $("#sq").oninput = e => { siteQ = e.target.value; $("#srows").innerHTML = siteRows(); };
  $("#se-export").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(D.sites.map(({company, short, suburb, address, contact, instructions, notes}) => ({company, short, suburb, address, contact, instructions, notes})), null, 1)], {type:"application/json"})); a.download = "kubic-load-sheet-sites.json"; a.click(); };
  $("#se-import").onclick = () => $("#se-file").click();
  $("#se-file").onchange = async e => { const f = e.target.files[0]; if (!f) return;
    let list; try { list = JSON.parse(await f.text()); if (!Array.isArray(list)) throw 0; } catch (x) { return toast("That file is not an address book export"); }
    const key = s => (String(s.company || "") + "|" + String(s.address || "")).toLowerCase().replace(/\s+/g, " ").trim(); const have = new Set(D.sites.map(key)); let n = 0; const t = now();
    for (const s of list) { if (!s || !String(s.company || "").trim() || !String(s.address || "").trim() || have.has(key(s))) continue; have.add(key(s)); n++;
      D.sites.push({id:uid(), company:String(s.company).trim(), short:String(s.short || "").trim(), suburb:String(s.suburb || "").trim(), address:String(s.address).trim(), contact:String(s.contact || "").trim(), instructions:lines(s.instructions).join("\n"), notes:String(s.notes || "").trim(), at:t, by:me.name || me.u}); }
    if (!n) return toast("Nothing new to import — those sites are already in the address book");
    D.sites.sort((a, b) => a.company.localeCompare(b.company)); await save("Sites imported"); toast(n + (n === 1 ? " site" : " sites") + " imported"); };
  $("#se-add").onclick = () => { siteEdit = {id:null, company:"", short:"", suburb:"", address:"", contact:"", instructions:"", notes:"", guides:[]}; guideErr = ""; render(); window.scrollTo(0, 0); };
  $("#main").oninput = e => { if (siteEdit && e.target.dataset.se) siteEdit[e.target.dataset.se] = e.target.value; };
  $("#main").onchange = e => { const id = e.target.dataset && e.target.dataset.guide; if (!siteEdit || !id) return; const g = new Set(siteEdit.guides || []); if (e.target.checked) g.add(id); else g.delete(id); siteEdit.guides = Array.from(g); };
  if (siteEdit) {
    $("#se-cancel").onclick = () => { siteEdit = null; guideErr = ""; render(); };
    $("#gu-add").onclick = async () => {
      const files = Array.from($("#gu-file").files || []), name = $("#gu-name").value.trim(), spec = $("#gu-pages").value;
      const fail = m => { guideErr = m; guideBusy = ""; render(); };
      if (!files.length) return fail("Choose a PDF or picture to upload.");
      if (!name) return fail("Give the guide a name, for example the customer and document.");
      if (guides().some(g => g.name.toLowerCase() === name.toLowerCase())) return fail("A guide with that name already exists — tick it above, or use a different name.");
      guideErr = ""; guideBusy = "Uploading…"; render();
      try {
        const built = await LoadSheetPdf.buildGuidePdf(await Promise.all(files.map(async f => ({name:f.name, type:f.type, bytes:new Uint8Array(await f.arrayBuffer())}))), spec);
        if (built.bytes.length > GUIDE_MAX) throw new Error("That guide is " + (built.bytes.length / 1048576).toFixed(1) + " MB — the limit is 6 MB. Use fewer pages or smaller pictures.");
        const g = {id:uid(), name, pages:built.pages, size:built.bytes.length, at:now(), by:me.name || me.u};
        await putGuide(g.id, built.bytes);
        guides().push(g); guides().sort((a, b) => a.name.localeCompare(b.name));
        if (siteEdit) siteEdit.guides = (siteEdit.guides || []).concat(g.id);
        guideBusy = ""; await save("Guide added"); toast("Guide uploaded — save the site to keep it attached");
      } catch (x) { fail(/encrypted|Failed to parse|No PDF header|Invalid|SOI not found|not a PNG/i.test(x && x.message || "") ? "That file could not be read as a PDF, JPG or PNG." : (x && x.message) || "Could not upload the guide."); }
    };
    $("#se-save").onclick = async () => { const e = siteEdit;
      if (!e.company.trim() || !e.address.trim()) return $("#se-err").textContent = "A site needs a company and an address.";
      const rec = {id:e.id || uid(), company:e.company.trim(), short:e.short.trim(), suburb:e.suburb.trim(), address:e.address.trim(), contact:e.contact.trim(), instructions:lines(e.instructions).join("\n"), notes:e.notes.trim(), guides:(e.guides || []).filter(id => guides().some(g => g.id === id)), at:now(), by:me.name || me.u};
      const i = D.sites.findIndex(x => x.id === rec.id); if (i >= 0) D.sites[i] = rec; else D.sites.push(rec);
      D.sites.sort((a, b) => a.company.localeCompare(b.company)); siteEdit = null; guideErr = "";
      await save((i >= 0 ? "Site updated: " : "Site added: ") + rec.company); if (!unsynced) toast(i >= 0 ? "Site updated" : "Site added"); };
  }
  $("#main").onclick = async e => {
    const gb = e.target.closest("tr [data-gact]");
    if (gb) { const g = guides().find(x => x.id === gb.closest("tr").dataset.gid); if (!g) return;
      if (gb.dataset.gact === "view") { try { downloadPdf(await getGuide(g.id), g.name.replace(/[\\/:*?"<>|]+/g, " ").trim() + ".pdf"); } catch (x) { toast("Could not load that guide — check your connection"); } }
      if (gb.dataset.gact === "del") { const used = D.sites.filter(x => (x.guides || []).includes(g.id)).length;
        if (!confirm("Remove the guide \"" + g.name + "\"?" + (used ? " It will come off " + used + (used === 1 ? " site." : " sites.") : ""))) return;
        const t = now(); D.sites.forEach(x => { if ((x.guides || []).includes(g.id)) { x.guides = x.guides.filter(id => id !== g.id); x.at = t; } });
        if (siteEdit) siteEdit.guides = (siteEdit.guides || []).filter(id => id !== g.id);
        D.guides = guides().filter(x => x !== g); touched.guidesGone.add(g.id); await dropGuideFile(g.id); await save("Guide removed"); }
      return; }
    const b = e.target.closest("tr [data-act]"); if (!b) return; const s = D.sites.find(x => x.id === b.closest("tr").dataset.id); if (!s) return;
    if (b.dataset.act === "edit") { siteEdit = Object.assign({}, s, {guides:(s.guides || []).slice()}); guideErr = ""; render(); window.scrollTo(0, 0); }
    if (b.dataset.act === "del") { if (!confirm("Remove " + s.company + " from the address book?")) return; D.sites = D.sites.filter(x => x !== s); touched.sitesGone.add(s.id); await save("Site removed: " + s.company); }
  };
}

/* ===================== My account ===================== */
const ROLE = {admin:"Administrator — everything, including users and settings", editor:"User — create load sheets and edit the address book"};
function vUsers() {
  return `<div class="card"><h2>My password</h2><div class="grid g3"><div><label for="mp1">New password (10+ characters)</label><input type="password" id="mp1"></div><div><label for="mp2">Confirm</label><input type="password" id="mp2"></div><div style="align-self:end"><button class="btn" id="mpgo">Change password</button></div></div>
    <div class="row" style="margin-top:16px"><button class="btn" id="rcnew">Create a new recovery code</button><span class="mut small">${me.rwrap ? "You have a recovery code. A new one cancels it." : "You have no recovery code yet — create one so you can reset a forgotten password yourself."}</span></div>
    <p class="mut small" style="margin:14px 0 0">Signed in as <b style="color:var(--txt)">${esc(me.u)}</b> · ${ROLE[me.role] || me.role}</p></div>`;
}
function bUsers() {
  $("#mpgo").onclick = async () => { const p = $("#mp1").value; if (p.length < 10) return toast("Password must be at least 10 characters"); if (p !== $("#mp2").value) return toast("Passwords do not match"); await setPassword(me, p, false); await save("Password changed for " + me.u); if (!unsynced) toast("Password changed"); };
  $("#rcnew").onclick = async () => { const code = await makeRecovery(me); await save("Recovery code created for " + me.u); showCode(code); };
}

/* ===================== Settings ===================== */
const tempPw = () => "Kubic-" + Array.from(rnd(6), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
function usersCard() {
  return `<div class="card"><h2>Users</h2><p class="mut">These logins belong to this tool only. An <b style="color:var(--txt)">Administrator</b> can also add and remove users and change these settings. A <b style="color:var(--txt)">User</b> can create load sheets and edit the address book.</p>
  ${unsynced || !D.ghToken ? '<div class="banner">Other people cannot sign in yet. Logins are only shared once this tool is saving to GitHub — the status at the top right must read “Saved to GitHub”. Fix the GitHub token above first.</div>' : ""}
  <div class="scroll"><table class="t"><thead><tr><th>Name</th><th>Username</th><th>Access</th><th></th></tr></thead><tbody>
  ${file.users.map(u => `<tr data-u="${esc(u.u)}"><td><b>${esc(u.name)}</b>${u.u === me.u ? ' <span class="pill">you</span>' : ""}${u.mustChange ? ' <span class="pill warn">temporary password — not signed in yet</span>' : ""}</td><td>${esc(u.u)}</td>
    <td><select data-role aria-label="Access for ${esc(u.name)}" style="width:auto" ${u.u === me.u ? "disabled" : ""}>${["admin","editor"].map(r => `<option value="${r}" ${u.role === r ? "selected" : ""}>${ROLE[r]}</option>`).join("")}</select></td>
    <td class="right">${u.u === me.u ? "" : '<button class="btn sm" data-reset>Reset password</button> <button class="btn sm danger" data-delu>Remove</button>'}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="timing"><b>Add a user</b><div class="grid g4" style="margin-top:10px"><div><label for="nu_name">Name</label><input id="nu_name" placeholder="e.g. Emma Smith"></div><div><label for="nu_user">Username (what they type to sign in)</label><input id="nu_user" autocapitalize="none" placeholder="e.g. emma"></div>
    <div><label for="nu_role">Access</label><select id="nu_role"><option value="editor">${ROLE.editor}</option><option value="admin">${ROLE.admin}</option></select></div><div><label for="nu_pw">Temporary password</label><input id="nu_pw"></div></div>
  <div class="row" style="margin-top:12px"><button class="btn pri" id="nu_go">Add user</button><span class="mut small">Send them the link, their username and this temporary password. They choose their own password the first time they sign in.</span></div></div>
  <div id="nu_done"></div></div>`;
}
function handover(name, u, pw) {   // details to pass on, shown once
  const link = location.origin + location.pathname, txt = `Kubic Load Sheets\nLink: ${link}\nUsername: ${u}\nTemporary password: ${pw}\nYou will be asked to choose your own password the first time you sign in.`;
  const el = $("#nu_done"); if (!el) return; el.innerHTML = `<div class="rate" style="margin-top:14px;border-color:var(--ok)"><b>Login ready for ${esc(name)}</b><pre style="margin:8px 0;white-space:pre-wrap;font:13px ui-monospace,Menlo,Consolas,monospace">${esc(txt)}</pre><button class="btn sm" id="nu_copy">Copy these details</button> <span class="mut small">The temporary password is not shown again.</span></div>`;
  $("#nu_copy").onclick = async () => { try { await navigator.clipboard.writeText(txt); toast("Copied"); } catch (e) { toast("Select the text and copy it by hand"); } };
}
function vSettings() {
  return `<div class="card"><h2>Sharing through GitHub</h2><p class="mut">Everything — logins, the address book and the load sheet history — is stored, encrypted, in one file in your GitHub repository. With a token saved here, every signed-in person's changes are committed straight to GitHub. Without one, changes stay in this browser.</p>
    <div class="grid g4"><div><label for="r_owner">Owner</label><input id="r_owner" data-r="owner" value="${esc(repo.owner)}"></div><div><label for="r_repo">Repository</label><input id="r_repo" data-r="repo" value="${esc(repo.repo)}"></div><div><label for="r_branch">Branch</label><input id="r_branch" data-r="branch" value="${esc(repo.branch)}"></div><div><label for="r_path">Data file</label><input id="r_path" data-r="path" value="${esc(repo.path)}"></div></div>
    <div style="margin-top:12px"><label for="tok">GitHub token</label><div class="row"><input type="password" id="tok" value="${esc(D.ghToken)}" placeholder="github_pat_… or ghp_…" style="flex:1" autocomplete="off"><button class="btn sm" id="tokshow">Show</button></div></div>
    <div class="row" style="margin-top:12px"><button class="btn pri" id="toktest">Test and save token</button><span class="pill ${!unsynced && D.ghToken ? "ok" : "warn"}">${!unsynced && D.ghToken ? "Connected — saving to GitHub" : "Not connected"}</span></div>
    ${tokMsg ? `<div class="rate" style="margin-top:12px;border-color:${tokMsg.ok ? "var(--ok)" : "var(--bad)"}"><b style="color:${tokMsg.ok ? "var(--ok)" : "var(--bad)"}">${tokMsg.ok ? "Working" : "Not working"}</b><div style="margin-top:4px">${tokMsg.text}</div>${tokMsg.gh ? `<div class="mut small" style="margin-top:6px">GitHub's reply: ${esc(tokMsg.gh)}</div>` : ""}</div>` : ""}
    <details style="margin-top:14px" ${!unsynced && D.ghToken ? "" : "open"}><summary style="cursor:pointer;color:var(--acc)">How to make a token that works</summary>
      <div class="grid g2" style="margin-top:10px;align-items:start"><div class="rate"><b>Easiest: a classic token</b><ol style="margin:8px 0 0;padding-left:18px"><li>Open <a href="https://github.com/settings/tokens/new?scopes=public_repo&description=Kubic%20load%20sheets" target="_blank" rel="noopener">this GitHub page</a> while signed in as ${esc(repo.owner)}.</li><li>Leave the <b>public_repo</b> box ticked. Tick nothing else.</li><li>Set an expiry, click <b>Generate token</b>, and copy it (starts <code>ghp_</code>).</li><li>Paste it above and click Test and save token.</li></ol></div>
      <div class="rate"><b>Tighter: a fine-grained token</b><ol style="margin:8px 0 0;padding-left:18px"><li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">this GitHub page</a>.</li><li><b>Repository access</b>: “Only select repositories”, then pick <b>${esc(repo.repo)}</b>.</li><li><b>Permissions → Repository permissions → Contents</b>: set to <b>Read and write</b>.</li><li>Generate, copy (starts <code>github_pat_</code>), paste above and test.</li></ol><div class="mut small" style="margin-top:6px">Both steps 2 and 3 are needed. The token you already use for the fuel levy tool also works here if it covers this repository.</div></div></div></details></div>
  ${usersCard()}
  <div class="card"><h2>Backup</h2><div class="row"><button class="btn" id="dl2">Download encrypted data file</button></div></div>`;
}
function bSettings() {
  $("#nu_pw").value = tempPw();
  $("#nu_go").onclick = async () => { const u = $("#nu_user").value.trim().toLowerCase(), n = $("#nu_name").value.trim(), pw = $("#nu_pw").value, role = $("#nu_role").value;
    if (!u || !n) return toast("Enter a name and username"); if (!/^[a-z0-9._-]+$/.test(u)) return toast("Username can only use letters, numbers, dot, dash and underscore"); if (file.users.some(x => x.u === u)) return toast("That username is taken"); if (pw.length < 8) return toast("Temporary password is too short");
    file.users.push(await makeUser(u, n, role, pw, keyRaw, true)); touched.users.add(u); touched.usersGone.delete(u); await save("User added: " + u); handover(n, u, pw); };
  $("#main").onclick = (async e => { const tr = e.target.closest("tr[data-u]"); if (!tr) return; const u = file.users.find(x => x.u === tr.dataset.u); if (!u) return;
    if ("reset" in e.target.dataset) { const pw = tempPw(); if (!confirm("Reset the password for " + u.name + "? Their current password stops working.")) return; await setPassword(u, pw, true); delete u.rwrap; delete u.rsalt; await save("Password reset for " + u.u); handover(u.name, u.u, pw); }
    if ("delu" in e.target.dataset) { if (!confirm("Remove " + u.name + "? They will no longer be able to sign in.")) return; file.users = file.users.filter(x => x !== u); touched.usersGone.add(u.u); touched.users.delete(u.u); await save("User removed: " + u.u); } });
  $("#main").onchange = (async e => { const r = e.target.dataset.r;
    if ("role" in e.target.dataset) { const u = file.users.find(x => x.u === e.target.closest("tr").dataset.u); u.role = e.target.value; touched.users.add(u.u); return save("Access changed for " + u.u); }
    if (r) { repo[r] = e.target.value.trim(); localStorage.setItem("kls_repo", JSON.stringify(repo)); fileSha = null; toast("Data location updated for this browser"); } });
  $("#dl2").onclick = downloadFile;
  $("#tokshow").onclick = () => { const i = $("#tok"); i.type = i.type === "password" ? "text" : "password"; $("#tokshow").textContent = i.type === "password" ? "Show" : "Hide"; };
  $("#toktest").onclick = async () => { const t = $("#tok").value.replace(/\s+/g, ""); const fix = `On GitHub, edit the token so that <b>Repository access</b> includes <b>${esc(repo.repo)}</b> and <b>Contents</b> is set to <b>Read and write</b> — or use the classic token steps below. Then press Test and save token again; the same token keeps working once its permissions are fixed.`;
    touched.token = true;
    if (!t) { D.ghToken = ""; tokMsg = null; return save(); }
    if (!/^(github_pat_|ghp_|gho_|ghu_)[A-Za-z0-9_]{20,}$/.test(t)) { tokMsg = {ok:false, text:"That does not look like a complete GitHub token. It should start with <b>github_pat_</b> or <b>ghp_</b> and have no spaces. GitHub shows a token only once, when it is created — if you did not copy it then, use <b>Regenerate token</b> on GitHub and paste the new value."}; return render(); }
    $("#toktest").disabled = true; $("#toktest").textContent = "Testing…";
    let who = null, st = 0, gh = "";
    try { const r = await fetch("https://api.github.com/user", {headers:{Authorization:"Bearer " + t, Accept:"application/vnd.github+json"}}); st = r.status; const j = await r.json().catch(() => ({})); if (r.ok) who = j.login; else gh = j.message || ""; }
    catch (e) { tokMsg = {ok:false, text:"This browser could not reach GitHub at all. Check the internet connection, or whether a work firewall or ad-blocker is blocking api.github.com."}; return render(); }
    if (st === 401) { tokMsg = {ok:false, gh, text:"GitHub does not recognise this token. It was mis-copied, has expired, or was deleted or regenerated since. Use <b>Regenerate token</b> on GitHub and paste the new value."}; return render(); }
    D.ghToken = t; await save("GitHub connection set up");
    if (!unsynced) tokMsg = {ok:true, text:`Saved to <b>${esc(repo.owner)}/${esc(repo.repo)}</b>${who ? " as " + esc(who) : ""}. Everyone who signs in now shares the same address book and history.`};
    else { const e = saveErr || {}; tokMsg = {ok:false, gh:e.gh, text:e.status === 403 || e.status === 404 ? `The token is genuine${who ? " (it belongs to " + esc(who) + ")" : ""}, but GitHub will not let it write to <b>${esc(repo.owner)}/${esc(repo.repo)}</b>. ` + fix : e.status ? "GitHub refused the save (error " + e.status + "). " + fix : "The token looks fine but the save could not reach GitHub. Try again."}; }
    render(); };
}

boot();
</script>
