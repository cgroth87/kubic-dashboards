<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kubic Fuel Levy Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1a2e;--panel:#222240;--panel2:#2a2a4d;--line:#333360;--txt:#e8e8f2;--mut:#9a9ac0;--acc:#e8751a;--ok:#34c38f;--bad:#ef5350;--warn:#f1b44c}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 12px}h3{font-size:13px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
p{margin:0 0 10px}a{color:var(--acc)}
.mut{color:var(--mut)}.small{font-size:12px}.right{text-align:right}.num{font-variant-numeric:tabular-nums}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.sm{padding:4px 10px;font-size:12px}.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wordmark{font-weight:700;letter-spacing:.08em;font-size:15px}.wordmark i{display:inline-block;width:11px;height:11px;background:var(--acc);margin:0 6px;vertical-align:-1px}
/* auth */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.authbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px;width:100%;max-width:400px}
.authbox .f{margin-bottom:14px}.err{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0}
/* shell */
#app{display:none;min-height:100%}
.side{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side .wordmark{padding:20px 18px}
.nav a{display:block;padding:10px 18px;color:var(--mut);text-decoration:none;border-left:3px solid transparent;cursor:pointer}
.nav a:hover{color:var(--txt)}.nav a.on{color:var(--txt);border-left-color:var(--acc);background:rgba(232,117,26,.08)}
.side .who{margin-top:auto;padding:16px 18px;border-top:1px solid var(--line);font-size:12px}
.main{margin-left:220px;padding:24px 28px 60px;max-width:1280px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}.top .sp{flex:1}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:rgba(154,154,192,.15);color:var(--mut)}
.pill.ok{background:rgba(52,195,143,.15);color:var(--ok)}.pill.warn{background:rgba(241,180,76,.15);color:var(--warn)}.pill.bad{background:rgba(239,83,80,.15);color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:4px 6px;border-bottom:1px solid rgba(51,51,96,.5);vertical-align:middle}
table.t input{padding:6px 8px}table.t input.n{width:78px;text-align:right}
.scroll{overflow-x:auto}
.rate{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px}
.rate .big{font-size:28px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.rate s{color:var(--mut);font-size:14px;margin-left:8px}
.banner{background:rgba(241,180,76,.12);border:1px solid rgba(241,180,76,.4);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.tabs{display:flex;gap:4px;margin-bottom:12px}.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--mut);cursor:pointer}.tabs button.on{color:var(--txt);border-bottom-color:var(--acc)}
.emailprev{background:#fff;color:#111;border-radius:8px;padding:24px;font:14px/1.5 Arial,Helvetica,sans-serif}
.emailprev h4{margin:18px 0 6px;font-size:15px}.emailprev p{margin:0 0 10px}
input[type=range]{padding:0;accent-color:var(--acc)}input[type=checkbox]{width:auto;accent-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--mut);cursor:pointer}
.chips button.on{background:rgba(232,117,26,.15);border-color:var(--acc);color:var(--txt)}.chips button span{opacity:.7;margin-left:4px}
table.list td{padding:9px 8px}table.list th{padding:8px}
tr.grp td{background:var(--bg);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:7px 18px!important;color:var(--acc)}
tr.clk{cursor:pointer}tr.clk:hover td,tr.clk.open td{background:rgba(232,117,26,.07)}
tr.exp>td{padding:0!important;background:var(--bg)}.editor{padding:16px 18px;border-left:3px solid var(--acc);max-width:min(1222px,calc(100vw - 278px));position:sticky;left:0}
@media (max-width:900px){.editor{max-width:calc(100vw - 34px)}}
table.sticky th:first-child,table.sticky tr.clk td:first-child{position:sticky;left:0;background:var(--panel);z-index:1}table.sticky tr.clk:hover td:first-child,table.sticky tr.clk.open td:first-child{background:#2b2640}
#tip{position:fixed;display:none;pointer-events:none;z-index:150;background:#11111f;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap}
#tip b{font-size:16px;display:block}circle.hit{cursor:pointer}circle.hit:hover{fill-opacity:.25}
.timing{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{background:var(--bg);border:0;padding:7px 16px;color:var(--mut);cursor:pointer}.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.opt{border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--bg)}.opt:hover{border-color:var(--acc)}.opt.on{border-color:var(--acc);background:rgba(232,117,26,.1)}
b.draft{font-weight:500;font-style:italic;color:var(--mut)}
#printroot{display:none}
#toast{position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--acc);border-radius:8px;padding:10px 16px;display:none;z-index:99}
/* letter */
.letterwrap{background:#55556a;padding:16px;border-radius:8px;overflow-x:auto}
.page{background:#fff;color:#000;width:210mm;min-height:296mm;margin:0 auto 16px;position:relative;font:10.5pt/1.4 Arial,Helvetica,sans-serif;padding:0 0 34mm}
.page .lh{display:flex;justify-content:space-between;align-items:flex-start;height:38mm}
.page .lh img{height:26mm;margin:6mm 0 0 8mm}
.page .lh .co{text-align:right;font-size:9.5pt;padding:7mm 6mm 0 0;flex:1}
.page .lh .blk{width:14mm;height:34mm;background:#f58020}
.page .body{padding:2mm 16mm 0}
.page table{border-collapse:collapse;margin:4mm 0;font-size:9.5pt}
.page th{background:#f79646;color:#fff;padding:3px 10px;border:1px solid #f79646}
.page td{padding:2px 10px;border:1px solid #f79646;text-align:center}
.page .ft{position:absolute;left:0;right:0;bottom:0;height:28mm;background:#f79646;display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;font-size:8.5pt;padding-top:5mm}
.page .ft b{display:block;font-size:9.5pt;margin-bottom:3mm}.page .ft div{padding:0 5mm;border-left:1px solid #c96a1c}.page .ft div:first-child{border:0}
.page .frm{margin:5mm 0 5mm 8mm;font-weight:bold}.page .frac{display:inline-block;text-align:center;vertical-align:middle}.page .frac span{display:block;padding:0 4px}.page .frac span:first-child{border-bottom:1px solid #000}
@media (max-width:900px){.side{position:static;width:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.nav{display:flex;flex-wrap:wrap}.side .who{margin:0;border:0}.main{margin:0;padding:16px}.g2,.g3,.g4{grid-template-columns:1fr}}
@media print{
  body{background:#fff}#app,#toast,#auth{display:none!important}#printroot{display:block!important}
  .letterwrap{background:none;padding:0}.page{margin:0;page-break-after:always;width:auto;min-height:0;height:296mm}
  .page th,.page .ft,.page .lh .blk{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>
<div id="auth"><div class="authbox" id="authbox"><div class="wordmark">KUBIC<i></i>FUEL LEVY</div><p class="mut" style="margin-top:14px">Loading…</p></div></div>
<div id="app">
  <aside class="side">
    <div class="wordmark">KUBIC<i></i>FUEL LEVY</div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="toast"></div>
<div id="printroot"></div>
<div id="tip"></div>

const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => { const a = new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
async function pwKey(password, salt, iter) {
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
const aesKey = raw => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt","decrypt"]);
async function seal(key, bytes) { const iv = rnd(12); const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, bytes); return {iv:b64(iv), ct:b64(ct)}; }
async function open(key, box) { return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(box.iv)}, key, unb64(box.ct))); }
async function makeUser(username, name, role, password, dataKeyRaw, mustChange) {
  const salt = rnd(16); const k = await pwKey(password, salt, PBKDF2_ITER);
  return {u:username.trim().toLowerCase(), name:name.trim(), role, salt:b64(salt), iter:PBKDF2_ITER, wrap:await seal(k, dataKeyRaw), mustChange:!!mustChange};
}

async function makeRecovery(rec) {   // a second way to unlock the data key, for a forgotten password
  const raw = Array.from(rnd(20), b => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b % 32]).join(""); const salt = rnd(16);
  rec.rsalt = b64(salt); rec.rwrap = await seal(await pwKey(raw, salt, PBKDF2_ITER), keyRaw); return raw.match(/.{5}/g).join("-");
}

const tgpAvg = w => { const v = (w.tgp || []).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const srcPrice = (w, s) => w._m ? w._price : s === "tgp" ? tgpAvg(w) : w[s];   // w is a week row, or a month built by monthPeriods()
const ftcFor = (p, we) => { let r = 0; (p.ftc || []).slice().sort((a, b) => a.from < b.from ? -1 : 1).forEach((x, i) => { if (i === 0 || x.from <= we) r = x.rate || 0; }); return r; };
// "net" method: strip GST (one-eleventh) and the fuel tax credit from the price before comparing with a base that is already net
function netParts(p, w) { const raw = srcPrice(w, p.source); if (raw == null) return null; const price = r2(raw), gst = r2(price / 11), ftc = ftcFor(p, w.we), net = r2(price - gst - ftc); return {price, gst, ftc, net, variance:r2(net - p.base)}; }
function rawLevy(p, w) { if (!p.base) return null; let bp1 = srcPrice(w, p.source); if (bp1 == null) return null; if (p.adj === "net") bp1 = netParts(p, w).net; return Math.max(0, r2((bp1 - p.base) / p.base * 100 * (p.comp / 100))); }
function discounted(raw, disc, mode) { if (raw == null) return null; if (!disc) return raw; return Math.max(0, r2(mode === "pts" ? raw - disc : raw * (1 - disc / 100))); }
const levy = (p, w) => discounted(rawLevy(p, w), p.disc || 0, p.discMode || "pct");
const weeksSorted = () => D.weeks.slice().sort((a, b) => a.we < b.we ? -1 : 1);
const effOf = we => addDays(we, 8);
const LAGS = {1:"The Monday straight after the price week", 8:"One week after the price week ends", 15:"Two weeks after the price week ends"};
const lagOf = p => LAGS[p.lag] ? +p.lag : 8;
const freqOf = p => p.freq === "monthly" ? "monthly" : "weekly";
const mlagOf = p => [1, 2, 3].includes(+p.mlag) ? +p.mlag : 1;
const monthAdd = (ym, n) => { const t = +ym.slice(0, 4) * 12 + (+ym.slice(5, 7) - 1) + n; return Math.floor(t / 12) + "-" + String(t % 12 + 1).padStart(2, "0"); };
const monthEnd = ym => iso(new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)));
const monthName = ym => MONTHS[+ym.slice(5, 7) - 1] + " " + ym.slice(0, 4);
const todayIso = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const nextMonday = () => { const t = todayIso(), dow = pd(t).getUTCDay(); return addDays(t, ((8 - dow) % 7) || 7); };
// Monthly averages built from the weekly sheet: retail = mean of the weekly figures for weeks ending in the month; terminal gate = mean of that month's weekday prices.
// A month only counts once prices reach its final week, so a part-month is never used.
function monthPeriods(source) {
  const acc = {}; let last = "", first = "9999";
  weeksSorted().forEach(w => { if (source === "tgp") (w.tgp || []).forEach((v, i) => { if (v != null) { const d = addDays(w.we, i - 6); (acc[d.slice(0, 7)] = acc[d.slice(0, 7)] || []).push(v); if (d > last) last = d; if (d < first) first = d; } });
    else if (w[source] != null) { (acc[w.we.slice(0, 7)] = acc[w.we.slice(0, 7)] || []).push(w[source]); if (w.we > last) last = w.we; if (w.we < first) first = w.we; } });
  return Object.keys(acc).sort().filter(ym => last >= addDays(monthEnd(ym), source === "tgp" ? -3 : -6) && first <= addDays(ym + "-01", source === "tgp" ? 3 : 6)).map(ym => ({we:monthEnd(ym), _m:ym, _n:acc[ym].length, _price:r2(acc[ym].reduce((a, b) => a + b, 0) / acc[ym].length)}));
}
const periods = p => freqOf(p) === "monthly" ? monthPeriods(p.source) : weeksSorted().filter(w => srcPrice(w, p.source) != null);
const latestPer = p => periods(p).slice(-1)[0];
const effKey = (p, per) => per._m ? monthAdd(per._m, mlagOf(p)) + "-01" : addDays(per.we, lagOf(p));
const perLabel = per => per._m ? monthName(per._m) + " average" : "week ending " + shortDate(per.we);
const effLabel = (monthly, key, long) => monthly ? monthName(key.slice(0, 7)) : long ? "Monday " + longDate(key) : shortDate(key);
const effFor = (p, we) => addDays(we, lagOf(p));   // price week ends on a Sunday; the levy starts on a Monday 1, 8 or 15 days later   // week ends Sunday; levy applies from the Monday eight days later

  const lead = srcs.includes("nat") ? "nat" : srcs[0] || "nat"; const cur = srcPrice(w, lead); if (cur == null) return "";
  const nm = {nat:"national average retail diesel price", melb:"Melbourne average retail diesel price", tgp:"average diesel terminal gate price"}[lead];
  let s = `The above rates are calculated from the ${lead === "tgp" ? "" : "Australian Institute of Petroleum (AIP) "}${nm} for the week ending ${longDate(w.we)}, which recorded approximately ${f1(cur)} cents per litre.`;
  const prev = i > 0 ? srcPrice(ws[i - 1], lead) : null;
  if (prev != null) {
    const d = r2(cur - prev); const dir = d > 0.05 ? 1 : d < -0.05 ? -1 : 0;
    if (!dir) s += ` Prices were steady on the prior week (${f1(prev)} cpl).`;
    else { let streak = 1; for (let j = i - 1; j > 0; j--) { const a = srcPrice(ws[j], lead), b = srcPrice(ws[j - 1], lead); if (a == null || b == null) break; const dd = a - b; if ((dir > 0 && dd > 0.05) || (dir < 0 && dd < -0.05)) streak++; else break; }
      s += ` This is ${dir > 0 ? "up" : "down"} ${f1(Math.abs(d))} cpl on the prior week (${f1(prev)} cpl)` + (streak > 1 ? `, the ${ord(streak)} consecutive weekly ${dir > 0 ? "increase" : "decrease"}.` : "."); }
  }
  return s;
}
function genModel() {
  const ws = weeksSorted(); const w = ws.find(x => x.we === gen.we); const act = D.profiles.filter(p => p.on);
  const fin = (p, wk) => { const raw = rawLevy(p, wk); return gen.apply[p.id] === false ? raw : discounted(raw, gen.disc, gen.mode); };
  return {ws, w, act, fin, rates:act.map(p => ({p, raw:w ? rawLevy(p, w) : null, fin:w ? fin(p, w) : null}))};
}
function vGenerate() {
  const ws = weeksSorted();
  if (!ws.length) return `<div class="card">No weekly prices yet. Add a week under <b>Weekly prices</b> first.</div>`;
  if (!gen.we || !ws.some(w => w.we === gen.we)) { gen.we = ws[ws.length - 1].we; gen.eff = effOf(gen.we); gen.context = null; }
  if (gen.outlook == null) gen.outlook = D.lastOutlook || "";
  const m = genModel(); if (gen.context == null) gen.context = autoContext(m.w, m.ws);
  const max = gen.mode === "pct" ? 100 : 60;
  return `<div class="grid g2" style="align-items:start"><div>
    <div class="card"><h2>1 · Week and customer</h2><div class="grid g3" style="grid-template-columns:1.4fr 1fr 1.2fr">
      <div><label>Prices for week ending</label><select id="g_we">${ws.slice().reverse().map(w => `<option value="${w.we}" ${w.we === gen.we ? "selected" : ""}>${longDate(w.we)}</option>`).join("")}</select></div>
      <div><label>Levy effective from</label><input type="date" id="g_eff" value="${gen.eff}"></div>
      <div><label>Customer</label><select id="g_cust"><option value="">All customers (standard)</option>${D.customers.filter(c => c.name).map(c => `<option value="${c.id}" ${gen.cust === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></div></div></div>
    <div class="card"><h2>2 · Discount lever</h2><div class="row"><input type="range" id="g_rng" min="0" max="${max}" step="0.5" value="${Math.min(gen.disc, max)}" style="flex:1;min-width:160px">
      <input type="number" id="g_disc" min="0" step="0.01" value="${gen.disc}" style="width:90px"><select id="g_mode" style="width:auto"><option value="pct" ${gen.mode === "pct" ? "selected" : ""}>% off the levy</option><option value="pts" ${gen.mode === "pts" ? "selected" : ""}>points off</option></select></div>
      <div class="row small" style="margin-top:10px"><span class="mut">Apply to:</span>${m.act.map(p => `<label style="margin:0;color:var(--txt)"><input type="checkbox" data-ap="${p.id}" ${gen.apply[p.id] === false ? "" : "checked"}> ${esc(p.name)}</label>`).join("")}
      <label style="margin:0 0 0 auto;color:var(--txt)"><input type="checkbox" id="g_show" ${gen.showDisc ? "checked" : ""}> Mention discount on notice</label></div>
      <div class="grid g2" id="g_rates" style="margin-top:14px"></div></div>
    <div class="card"><h2>3 · Commentary</h2><div class="row" style="justify-content:space-between"><label>Price context (written from your figures — edit freely)</label><a class="small" id="g_regen" style="cursor:pointer">Rewrite from data</a></div>
      <textarea id="g_ctx" rows="5">${esc(gen.context)}</textarea><label style="margin-top:12px">Looking ahead (your market comment — leave blank to omit)</label><textarea id="g_out" rows="6">${esc(gen.outlook)}</textarea></div>
  </div><div><div class="card"><div class="row" style="justify-content:space-between"><div class="tabs" style="margin:0"><button data-tab="email" class="${gen.tab === "email" ? "on" : ""}">Email</button><button data-tab="letter" class="${gen.tab === "letter" ? "on" : ""}">Letter (PDF)</button></div><div class="row" id="g_actions"></div></div>
    <div id="printzone" style="margin-top:12px"></div></div></div></div>`;
}
function emailParts(m) {
  const s = D.settings; const cust = D.customers.find(c => c.id === gen.cust);
  const lines = m.rates.map(r => `${r.p.name} Fuel Levy:  ${f2(r.fin)}%` + (gen.showDisc && gen.disc && r.raw !== r.fin ? ` (standard rate ${f2(r.raw)}%, less your ${gen.mode === "pct" ? gen.disc + "% discount" : gen.disc + " point discount"})` : ""));
  return {subject:s.subject + (cust ? " – " + cust.name : ""), greeting:s.greeting, eff:`Effective ${longDate(gen.eff, true)}, our fuel levy rates have been adjusted as follows:`, lines, context:gen.context.trim(), method:s.methodology.trim(), outlook:gen.outlook.trim(), closing:s.closing.trim(),
    sign:["Regards,", "", s.signName, s.signTitle, s.signPhone + " │ " + s.signEmail]};
}
function emailText(e) {
  return [e.greeting, "", "Updated Fuel Levy Rates", e.eff, "", ...e.lines, "", "AIP Diesel Price Context", e.context, "", e.method, ...(e.outlook ? ["", "Looking Ahead", e.outlook] : []), "", e.closing, "", ...e.sign].join("\n");
}
function emailHtml(e) {
  const para = t => t.split(/\n\s*\n/).map(x => `<p>${esc(x).replace(/\n/g, "<br>").replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1">$1</a>')}</p>`).join("");
  return `<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#111;line-height:1.5"><p>${esc(e.greeting)}</p><h4 style="margin:18px 0 6px;font-size:15px">Updated Fuel Levy Rates</h4><p>${esc(e.eff)}</p>
    ${e.lines.map(l => { const i = l.indexOf(":"); return `<p><b>${esc(l.slice(0, i + 1))}</b>${esc(l.slice(i + 1))}</p>`; }).join("")}
    <h4 style="margin:18px 0 6px;font-size:15px">AIP Diesel Price Context</h4>${para(e.context)}${para(e.method)}${e.outlook ? '<h4 style="margin:18px 0 6px;font-size:15px">Looking Ahead</h4>' + para(e.outlook) : ""}${para(e.closing)}
    <p>Regards,</p><p><b>${esc(e.sign[2])}</b><br>${esc(e.sign[3])}<br>${esc(e.sign[4])}</p></div>`;
}
function letterHtml(m) {
  const s = D.settings; const i = m.ws.indexOf(m.w); const hist = m.ws.slice(Math.max(0, i - s.historyWeeks + 1), i + 1); const srcs = [...new Set(m.act.map(p => p.source))];
  const lh = `<div class="lh"><img src="${LOGO}" alt="Kubic Transport"><div class="co"><b>${esc(s.company)}</b><br>${esc(s.abn)}<br><b>Head Office</b><br>${esc(s.address)}<br><b>${esc(s.web)}</b></div><div class="blk"></div></div>`;
  const ft = `<div class="ft"><div><b>Local Transport</b>Experienced, professional &amp; safe drivers delivering ontime, anywhere</div><div><b>3PL Warehousing</b>We consider ourselves partners with our clients, our depot is your depot</div><div><b>Interstate Transport</b>Australia Wide, Quick and Reliable solutions for General/Express services</div></div>`;
  const cust = D.customers.find(c => c.id === gen.cust);
  // chart
  const col = {nat:"#1f77b4", melb:"#f58020", tgp:"#555"}; const pts = srcs.map(sc => ({sc, v:hist.map(w => srcPrice(w, sc))})); const all = pts.flatMap(p => p.v).filter(v => v != null);
  let chart = "";
  if (all.length > 1 && hist.length > 1) { const lo = Math.floor(Math.min(...all) - 2), hi = Math.ceil(Math.max(...all) + 2), W = 640, H = 200, L = 44, R = 12, T = 22, B = 40; const x = k => L + k * (W - L - R) / (hist.length - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo);
    const ticks = [0, 1, 2, 3, 4].map(k => lo + k * (hi - lo) / 4);
    chart = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin:2mm 0" font-family="Arial" font-size="9"><text x="${W / 2}" y="10" text-anchor="middle" font-size="10" font-weight="bold">AVERAGE WEEKLY DIESEL PRICES (CENTS PER LITRE)</text>
      ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#ddd"/><text x="${L - 5}" y="${y(t) + 3}" text-anchor="end">${t.toFixed(1)}</text>`).join("")}
      ${hist.map((w, k) => `<text x="${x(k)}" y="${H - 26}" text-anchor="middle">${shortDate(w.we).slice(0, -3)}</text>`).join("")}
      ${pts.map(p => { const seg = p.v.map((v, k) => v == null ? null : `${x(k).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean); return `<polyline fill="none" stroke="${col[p.sc]}" stroke-width="1.6" points="${seg.join(" ")}"/>` + p.v.map((v, k) => v == null ? "" : `<circle cx="${x(k).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.4" fill="${col[p.sc]}"/>`).join(""); }).join("")}
      ${pts.map((p, k) => `<rect x="${L + k * 150}" y="${H - 7}" width="10" height="3" fill="${col[p.sc]}"/><text x="${L + k * 150 + 14}" y="${H - 3}">${SRC_SHORT[p.sc].toUpperCase()}</text>`).join("")}</svg>`; }
  const p1 = `<div class="page">${lh}<div class="body"><p>Dear Valued Client${cust ? " — " + esc(cust.name) : ""},</p>
    <p>Effective ${longDate(gen.eff, true)}, ${esc(s.company.replace(/ PTY LTD$/i, ""))}'s fuel surcharge${m.rates.length > 1 ? "s" : ""} will be amended to: ${m.rates.map(r => `<b>${esc(r.p.name)} ${f2(r.fin)}%</b>`).join(" and ")}.${gen.showDisc && gen.disc ? ` These rates include your discount of ${gen.disc}${gen.mode === "pct" ? "% off the standard levy" : " percentage points"}.` : ""}</p>
    <p><b>RE: Fuel Surcharge Adjustment</b></p>
    <table><tr><th>Index week<br>ending</th>${srcs.map(sc => `<th>${SRC_SHORT[sc]}<br>(cpl)</th>`).join("")}<th>Fuel levy<br>effective</th>${m.act.map(p => `<th>${esc(p.name)}<br>fuel levy</th>`).join("")}</tr>
    ${hist.map(w => `<tr><td>${shortDate(w.we)}</td>${srcs.map(sc => `<td>${f2(srcPrice(w, sc))}</td>`).join("")}<td>${shortDate(w.we === m.w.we ? gen.eff : effOf(w.we))}</td>${m.act.map(p => { const v = m.fin(p, w); return `<td>${v == null ? "—" : f2(v) + "%"}</td>`; }).join("")}</tr>`).join("")}</table>
    ${chart}
    ${srcs.includes("nat") ? "<p>Reference: https://aip.com.au/pricing/diesel/national-retail-diesel-prices/national-average/</p>" : ""}${srcs.includes("melb") ? "<p>Reference: https://aip.com.au/pricing/diesel/victorian-retail-diesel-prices/melbourne/</p>" : ""}
    <p>Should you require any further information please feel free to get in contact.</p><p>Kind regards,</p><p style="margin-top:6mm">${esc(s.signName)}<br><b>${esc(s.signTitle)}</b><br>${esc(s.signPhone)}</p></div>${ft}</div>`;
  const p2 = `<div class="page">${lh}<div class="body" style="padding-top:14mm"><p>FUEL SURCHARGE FORMULA</p><br>
    <p>BP<sub>0</sub> = Base Price (cents per litre, incl. GST), as set out for each service below.<br>BP<sub>1</sub> = New Base Price (the average price in cents per litre for the index week, by reference to the price series set out for each service below)<br>V = Fuel Price Variation (cents per litre)</p>
    <p>MF = Fuel Surcharge</p><p>FCC = Fuel Cost Component, as set out for each service below</p><p>Then</p>
    <div class="frm">V &nbsp;=&nbsp; BP<sub>1</sub> − BP<sub>0</sub></div><div class="frm">MF = <span class="frac"><span>BP<sub>1</sub> − BP<sub>0</sub></span><span>BP<sub>0</sub></span></span> x 100 x FCC</div>
    <table><tr><th>Service</th><th>Price series (BP<sub>1</sub>)</th><th>BP<sub>0</sub> (cpl)</th><th>FCC</th></tr>${m.act.map(p => `<tr><td>${esc(p.name)}</td><td>${SOURCES[p.source]}</td><td>${f2(p.base)}${p.baseNote ? "<br><span style='font-size:8pt'>" + esc(p.baseNote) + "</span>" : ""}</td><td>${p.comp}%</td></tr>`).join("")}</table>
    <p>For ease of calculation, the weekly fuel surcharge is calculated from the previous week's average fuel price and applied each Monday in arrears. For example, the fuel surcharge effective ${longDate(gen.eff, true)} is based on the average price for the week ending ${longDate(m.w.we, true)}.</p></div>${ft}</div>`;
  return `<div class="letterwrap">${p1}${p2}</div>`;
}
function drawGen() {
  const m = genModel(); if (!m.w) return;
  $("#g_rates").innerHTML = m.rates.map(r => `<div class="rate"><div class="mut small">${esc(r.p.name)} · ${SRC_SHORT[r.p.source]} ${f2(srcPrice(m.w, r.p.source))} cpl</div><div><span class="big">${r.fin == null ? "—" : f2(r.fin) + "%"}</span>${r.raw != null && r.raw !== r.fin ? `<s>${f2(r.raw)}%</s>` : ""}</div></div>`).join("") || '<p class="mut">No calculations are switched on for notices.</p>';
  const missing = m.rates.filter(r => r.raw == null).map(r => r.p.name);
  const warn = missing.length ? `<div class="banner">No ${missing.join(" or ")} price entered for this week — add it under Weekly prices.</div>` : pd(gen.eff).getUTCDay() !== 1 ? `<div class="banner">The effective date is not a Monday.</div>` : "";
  const e = emailParts(m);
  if (gen.tab === "email") {
    $("#printzone").innerHTML = warn + `<div class="small mut" style="margin-bottom:8px">Subject: <b style="color:var(--txt)">${esc(e.subject)}</b></div><div class="emailprev" id="emailprev">${emailHtml(e)}</div>`;
    $("#g_actions").innerHTML = `<button class="btn pri" id="g_copy">Copy email</button><button class="btn" id="g_mail">Open in mail app</button>`;
    $("#g_copy").onclick = async () => { const html = emailHtml(e), text = emailText(e);
      try { await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html], {type:"text/html"}), "text/plain":new Blob([text], {type:"text/plain"})})]); }
      catch (err) { try { await navigator.clipboard.writeText(text); } catch (e2) { const r = document.createRange(); r.selectNode($("#emailprev")); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); } }
      toast("Email copied — paste it into your message"); rememberOutlook(); };
    $("#g_mail").onclick = () => { location.href = "mailto:?subject=" + encodeURIComponent(e.subject) + "&body=" + encodeURIComponent(emailText(e)); rememberOutlook(); };
  } else {
    $("#printzone").innerHTML = warn + letterHtml(m);
    $("#g_actions").innerHTML = `<button class="btn pri" id="g_print">Print / save as PDF</button>`;
    $("#g_print").onclick = () => { rememberOutlook(); $("#printroot").innerHTML = letterHtml(genModel()); const t = document.title; document.title = "Kubic Transport Fuel Adjustment Notification - " + shortDate(gen.eff); window.print(); document.title = t; };
  }
}
function rememberOutlook() { if (can("edit") && gen.outlook !== D.lastOutlook) { D.lastOutlook = gen.outlook; markDirty(); } }
function bGenerate() {
  if (!$("#g_we")) return; drawGen();
  $("#g_we").onchange = e => { gen.we = e.target.value; gen.eff = effOf(gen.we); gen.context = null; render(); };
  $("#g_eff").onchange = e => { if (e.target.value) gen.eff = e.target.value; drawGen(); };
  $("#g_cust").onchange = e => { gen.cust = e.target.value; const c = D.customers.find(x => x.id === gen.cust); gen.disc = c ? c.disc : 0; gen.mode = c ? c.mode : gen.mode; render(); };
  const setDisc = v => { gen.disc = Math.max(0, num(v) ?? 0); $("#g_disc").value = gen.disc; $("#g_rng").value = gen.disc; drawGen(); };
  $("#g_rng").oninput = e => setDisc(e.target.value); $("#g_disc").onchange = e => setDisc(e.target.value);
  $("#g_mode").onchange = e => { gen.mode = e.target.value; render(); };
  $("#g_show").onchange = e => { gen.showDisc = e.target.checked; drawGen(); };
  $("#main").querySelectorAll("[data-ap]").forEach(c => c.onchange = () => { gen.apply[c.dataset.ap] = c.checked; drawGen(); });
  $("#g_ctx").oninput = e => { gen.context = e.target.value; drawGen(); }; $("#g_out").oninput = e => { gen.outlook = e.target.value; drawGen(); };
  $("#g_regen").onclick = () => { gen.context = null; render(); };
  $("#main").querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { gen.tab = b.dataset.tab; render(); });
}
document.addEventListener("mousemove", e => { const tip = $("#tip"), h = e.target.closest && e.target.closest("[data-tip]"); if (!h) { tip.style.display = "none"; return; }
  const [n, v, d, src, c] = h.dataset.tip.split("|"); tip.innerHTML = `<span style="color:${c}">●</span> ${esc(n)}<b>${esc(v)}</b><span class="mut">${esc(d)}<br>${esc(src)}</span>`; tip.style.display = "block";
  const w = tip.offsetWidth, ht = tip.offsetHeight; tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, e.clientX + 14)) + "px"; tip.style.top = (e.clientY - ht - 12 < 8 ? e.clientY + 16 : e.clientY - ht - 12) + "px"; });
boot();
</script>
